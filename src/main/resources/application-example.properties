spring.application.name=cv-backend

# ==========================================
# CONFIGURACIÓN DE SUPABASE (POSTGRESQL)
# ==========================================

# 1. URL de conexión JDBC (Usa el puerto 5432 para Direct Connection o 6543 si usas el Pooler)
spring.datasource.url=jdbc:postgresql://db.ejemplooo.supabase.co:5432/postgres

# 2. Usuario de la base de datos (por defecto es postgres)
spring.datasource.username=postgres

# 3. La contraseña que guardaste al crear tu proyecto en Supabase
spring.datasource.password=passsssss

# 4. Driver de PostgreSQL que añadiste en las dependencias
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================

# Valida el esquema de la base de datos sin sobreescribir tus tablas manuales
spring.jpa.hibernate.ddl-auto=validate

# Muestra en la consola las consultas SQL que Spring Boot va ejecutando (¡Muy útil para aprender!)
spring.jpa.show-sql=true

# Formatea el SQL para que sea legible en la terminal
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para que Hibernate optimice las consultas para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect